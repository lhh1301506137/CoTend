interface:
  display_name: "CoTend Init"
  short_description: "Init workflow and route idea baseline"
  default_prompt: "Use $cotend-init as the thin v1.67 initialization entry. Delegate project-state classification, user-facing language resolution/persistence, and actual-byte pre-handback validation to Project Init; consume its canonical result, fail closed on a remaining fail or blocked gate, and report in the resolved language. Idempotently initialize, update, repair, migrate, or resume while preserving the user's Full/Adaptive choice, confirmed L0-L2 meaning, pending decisions, Route Rebase, and reliable resume boundary. Shallow-detect idea intake and hand off new_baseline without reading product meaning. Do not run Semantic Alignment, Diagnose Only, implementation, or other appended work. Return control exactly once with readiness, blockers, evidence, and next action; later broad work must pass the native pre-development gate."
