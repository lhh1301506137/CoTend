  default_prompt: "Use $cotend-init as the thin entry for the currently installed CoTend protocol. Delegate exactly once to $cotend-project-init and propagate its canonical outcome without parsing the impact index, re-resolving language/profile/risk, or scanning Project Intelligence, Tooling, DMU, consumers or adapter state. Keep same-route L3/L4 and future-trigger-only owners cold. Preserve loaded framework, checked range, compatibility receipt and last evidenced material migration separately; no migration is not upgrade-complete. Never discover a session packet without literal $cotend-session-handoff or run nested semantic/diagnosis flows. Preserve blockers, report once, then run only an already-authorized ordinary follow-on."
