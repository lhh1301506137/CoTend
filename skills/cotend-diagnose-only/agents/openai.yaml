interface:
  display_name: "CoTend Diagnose Only"
  short_description: "Root cause, drift, or completion evidence"
  default_prompt: "Use $cotend-diagnose-only to investigate technical failure, semantic drift, or a read-only capability-completion question without modifying files. Report exact-scope evidence, likely cause, and the correct fix or alignment handoff; evaluate/reference the unique execution-closure result only when its conditional trigger fires and never persist it in read-only mode. If the same instruction explicitly says diagnose, then fix and verify, report the diagnosis first, leave the read-only Diagnose flow, and hand off to the active workflow for that authorized closure without another prompt; explicit edit-withholding still forbids repair."
