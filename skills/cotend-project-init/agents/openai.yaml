interface:
  display_name: "CoTend Project Init"
  short_description: "Impact-directed project initialization"
  default_prompt: "Use $cotend-project-init with the v2.01 collaboration contract to initialize, update, repair, migrate, or resume CoTend. Resolve framework impact before broad reads, load only selected owners, preserve Full/Adaptive and user-owned risk, validate actual changed bytes with at most one repair/recheck, and return one handback. A named upstream Dual handoff/install or external adapter sync alone loads external-reviewer-sync; ordinary Init never interprets product meaning or runs CodeGraph initialization without explicit approval."
