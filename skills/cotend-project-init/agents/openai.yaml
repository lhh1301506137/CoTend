interface:
  display_name: "CoTend Project Init"
  short_description: "Init workflow and route idea baseline"
  default_prompt: "Use $cotend-project-init Auto Mode for CoTend v1.67 with progressive disclosure. Exclusively resolve user-facing governance language from explicit current choice, canonical STATUS, project-local explicit instruction, then default en; normalize and persist it, stop human_needed on conflicts, and never infer from conversation, repository, account, or host locale. Classify fresh, update, repair, resume, or blocked and make CoTend current idempotently without changing product meaning. Preserve Full/Adaptive, confirmed L0-L2, pending decisions, Route Rebase, and the reliable resume boundary. For changed governance files, run the bundled read-only pre-handback validator over VCS evidence, write receipts, and the CoTend checker; allow one same-turn recheck and fail closed on remaining fail or blocked. Shallow-detect idea intake for an independent new_baseline handoff. Do not run Semantic Alignment, Diagnose Only, or implementation. Return one explicit handback with readiness and next action."
