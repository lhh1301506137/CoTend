interface:
  display_name: "CoTend Semantic Alignment"
  short_description: "Align product intent and repair semantic drift"
  default_prompt: "Use $cotend-semantic-alignment directly, without Init, for writable product meaning. Teach back and confirm each affected L2 charter before its product rules. Build the exact per-node semantic contract before asking, then persist and mechanically verify it after confirmation without exposing hash mechanics. Keep derived acceptance, impact analysis, and L3/L4 rules AI-owned. For material L0-L2 route change, show original meaning, discovery, recommendation, product impact, and accept/reject consequences; after confirmation propagate only through declared dependencies, classify affected artifacts, set the reliable resume boundary, and require refreshed acceptance and closure evidence. Preserve baseline and navigation truth, migrate legacy-unbound nodes only at relevant high-value triggers, and never treat semantic confirmation as implementation proof."
