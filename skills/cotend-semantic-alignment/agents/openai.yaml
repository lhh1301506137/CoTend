interface:
  display_name: "CoTend Semantic Alignment"
  short_description: "Align product intent and repair semantic drift"
  default_prompt: "Use $cotend-semantic-alignment directly, without full Init, for writable product meaning. Consume Project Init's persisted governance language; if absent, invalid, or conflicting, delegate only language resolution to Project Init and never infer it. Teach back and confirm each affected L0-L2 contract, including every L2 charter before rules; persist and mechanically verify the exact confirmed contract. Keep acceptance derivation, impact analysis, and L3/L4 choices AI-owned. For material change, show old meaning, discovery, recommendation, impact, and accept/reject effects; after confirmation update declared dependencies, set the reliable resume boundary, and refresh acceptance and closure evidence. Semantic confirmation is never implementation proof."
