interface:
  display_name: "CoTend Collaboration"
  short_description: "Carrier-aware actual-model collaboration"
  default_prompt: "Use $cotend-collaboration v1.65 and load only triggered references; fail closed if one is missing. Resolve one native current/dormant/conflict record and classify foreign frameworks as evidence only. Keep identity separate from user-owned Full/Adaptive. Resolve session, persistent project, one unambiguous project-local legacy choice, then the Full default; preserve the project choice and map it to delegated_pair or inline without writing foreign config. Protect separately confirmed L0-L2 contracts while keeping L3/L4 AI-owned. Use Route Rebase only for material change and resume from its reliable boundary. Require implementation closure and current acceptance evidence before advancing important work. Use agents only for positive net benefit with root-owned integration. Preserve risk, review, Plan Tree, tests, acceptance, Done, release, AI UAT, Quality Sentinel, and explicit handback boundaries."
