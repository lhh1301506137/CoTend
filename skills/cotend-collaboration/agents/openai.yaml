interface:
  display_name: "CoTend Collaboration"
  short_description: "Carrier-aware actual-model collaboration"
  default_prompt: "Use $cotend-collaboration v1.71 and load only triggered references. Preserve the CoTend Full first-use default and treat Full/Adaptive separately from the user-owned low/medium/dev_high tier, which defaults to medium and is never activated by a recommendation. Apply the execution-authorization contract before asking: Adaptive continues an active in-scope route; Full closes the authorized task through fix and recheck; both keep identical user-only stops. Load $cotend-session-handoff only when that literal appears in the current input, then require frozen-packet current/stale/conflict preflight before new-session writes. Preserve confirmed L0-L2, AI-owned L3/L4, evidence, review, Plan Tree, acceptance, release, and handback gates."
